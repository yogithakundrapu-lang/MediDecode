<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nearby Medical Shops — MediDecode</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Existing CSS -->
<link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="app-shell">

    <!-- =========================================
         SIDEBAR
         ========================================= -->

    <div
        id="app-sidebar"
        data-active="hospitals">
    </div>


    <div class="main-col">

        <!-- =========================================
             TOPBAR
             ========================================= -->

        <div
            id="app-topbar"
            data-title-key="medical_shops"
            data-subtitle-key="nearby_services">
        </div>


        <div class="content">


            <!-- =========================================
                 PAGE TABS
                 ========================================= -->

            <div class="tab-bar">

                <a
                    href="hospitals.html"
                    class="tab-btn"
                    data-i18n="nearby_hospitals">
                    Hospitals
                </a>


                <a
                    href="medicalshops.html"
                    class="tab-btn active"
                    data-i18n="medical_shops">
                    Medical Shops
                </a>


                <a
                    href="labs.html"
                    class="tab-btn"
                    data-i18n="diagnostic_labs">
                    Diagnostic Labs
                </a>

            </div>



            <!-- =========================================
                 TOOLBAR
                 ========================================= -->

            <div class="page-toolbar">


                <!-- Search -->

                <div class="search-box">

                    <span>🔍</span>

                    <input
                        type="text"
                        id="shopSearch"
                        placeholder="Search medical shops..."
                        aria-label="Search medical shops"
                        data-i18n-placeholder="search_medical_shops">

                </div>



                <!-- Location -->

                <button
                    type="button"
                    class="btn btn-outline"
                    id="locationBtn"
                    data-i18n="use_my_location">

                    📍 Use My Location

                </button>



                <!-- Refresh -->

                <button
                    type="button"
                    class="btn btn-outline"
                    id="refreshBtn"
                    data-i18n="refresh">

                    ↻ Refresh

                </button>


            </div>



            <!-- =========================================
                 MAIN CONTENT
                 ========================================= -->

            <div class="grid-2-1-1">


                <!-- =====================================
                     MEDICAL SHOPS
                     ===================================== -->

                <div class="card">


                    <h3
                        style="margin:0 0 14px;font-size:16px;"
                        data-i18n="pharmacies_near_you">

                        Pharmacies Near You

                    </h3>



                    <!--
                        IMPORTANT:

                        This container is intentionally EMPTY.

                        No medical shops are hard-coded here.

                        Flask will load the shops dynamically.
                    -->

                    <div id="shopList">

                        <!-- Medical shops will be loaded dynamically -->

                    </div>



                    <!-- =================================
                         NO RESULTS
                         ================================= -->

                    <div
                        id="noResults"
                        class="empty-state"
                        style="display:none;">

                        <div class="empty-icon">
                            🔍
                        </div>


                        <h3 data-i18n="no_medical_shops_text">
                            No medical shops found
                        </h3>


                        <p data-i18n="try_different_shop_location">
                            Try searching with a different shop or location.
                        </p>

                    </div>


                </div>



                <!-- =====================================
                     MAP
                     ===================================== -->

                <div class="card">


                    <h3
                        style="margin:0 0 14px;font-size:16px;"
                        data-i18n="map">

                        Map

                    </h3>



                    <div
                        class="map-placeholder"
                        id="mapArea">


                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8">

                            <path
                                d="M12 21s-7-5.2-7-10.5A7 7 0 0 1 19 10.5C19 15.8 12 21 12 21Z"/>

                            <circle
                                cx="12"
                                cy="10.5"
                                r="2.3"/>

                        </svg>


                        <span id="mapMessage" data-i18n="medical_shops_map">
                            Medical shops map
                        </span>


                    </div>



                    <!-- Google Maps -->

                    <button
                        type="button"
                        class="btn btn-primary btn-block"
                        id="mapsBtn"
                        style="margin-top:16px;"
                        data-i18n="open_in_google_maps">

                        Open in Google Maps

                    </button>


                </div>


            </div>



            <!-- =========================================
                 INFORMATION CARD
                 ========================================= -->

            <div class="card">


                <h3
                    style="margin:0 0 10px;font-size:16px;"
                    data-i18n="pharmacy_information">

                    Pharmacy Information

                </h3>


                <p data-i18n="find_nearby_medical_shops">

                    Find nearby medical shops and pharmacies
                    using your current location.

                </p>


                <div class="badge" data-i18n="pharmacy_services">

                    💊 Pharmacy Services

                </div>


            </div>


        </div>

    </div>

</div>



<!-- =============================================
     EXISTING JAVASCRIPT
     ============================================= -->

<script src="js/app-shell.js"></script>

<script src="js/i18n.js"></script>



<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =========================================
           ELEMENTS
           ========================================= */

        const searchInput =
            document.getElementById("shopSearch");


        const shopList =
            document.getElementById("shopList");


        const noResults =
            document.getElementById("noResults");


        const locationBtn =
            document.getElementById("locationBtn");


        const refreshBtn =
            document.getElementById("refreshBtn");


        const mapsBtn =
            document.getElementById("mapsBtn");


        const mapMessage =
            document.getElementById("mapMessage");



        /* =========================================
           LOCATION VARIABLES
           ========================================= */

        let userLatitude = null;

        let userLongitude = null;



        /* =========================================
           SHOP DATA
           ========================================= */

        let medicalShops = [];



        /* =========================================
           ESCAPE HTML
           ========================================= */

        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;
        }



        /* =========================================
           CREATE SHOP CARD
           ========================================= */

        function createShopCard(shop) {


            const card =
                document.createElement("div");


            card.className =
                "hospital-card shop-item";


            /* Store information for search */

            card.dataset.name =
                shop.name || "";


            card.dataset.address =
                shop.address || "";


            card.dataset.latitude =
                shop.latitude;


            card.dataset.longitude =
                shop.longitude;



            /* Distance */

            let distance =
                shop.distance;


            if (
                !distance &&
                shop.distance_km !== undefined
            ) {

                distance =
                    Number(shop.distance_km)
                        .toFixed(1)
                    + " km";

            }


            if (!distance) {

                distance =
                    t("address_not_available");

            }



            /* =====================================
               CARD HTML
               ===================================== */

            card.innerHTML = `

                <div
                    class="h-icon"
                    style="
                        background:var(--color-green-light);
                        color:var(--color-green);
                    ">

                    💊

                </div>


                <div>

                    <h4>
                        ${escapeHtml(
                            shop.name || t("medical_shop")
                        )}
                    </h4>


                    <p>
                        ${escapeHtml(
                            shop.address ||
                            t("address_not_available")
                        )}
                    </p>

                </div>


                <div class="h-meta">

                    <div class="h-rating">

                        💊 ${escapeHtml(t("pharmacy_services"))}

                    </div>


                    <span>
                        ${escapeHtml(distance)}
                    </span>

                </div>

            `;



            /* =====================================
               CLICK SHOP → GOOGLE MAPS NAVIGATION
               ===================================== */

            card.addEventListener(
                "click",
                function () {


                    const latitude =
                        shop.latitude;


                    const longitude =
                        shop.longitude;



                    if (
                        latitude === undefined ||
                        longitude === undefined ||
                        latitude === null ||
                        longitude === null
                    ) {

                        return;

                    }



                    const mapsUrl =
                        "https://www.google.com/maps/dir/?api=1" +
                        "&destination=" +
                        encodeURIComponent(
                            latitude + "," + longitude
                        );



                    window.open(
                        mapsUrl,
                        "_blank"
                    );

                }
            );



            /* Pointer */

            card.style.cursor =
                "pointer";



            return card;

        }



        /* =========================================
           DISPLAY SHOPS
           ========================================= */

        function displayShops(shops) {


            /* Remove everything currently displayed */

            shopList.innerHTML = "";


            /* No shops */

            if (
                !shops ||
                shops.length === 0
            ) {

                noResults.style.display =
                    "block";

                return;

            }


            noResults.style.display =
                "none";



            /* Add dynamic cards */

            shops.forEach(
                function (shop) {

                    const card =
                        createShopCard(shop);

                    shopList.appendChild(card);

                }
            );


            /* Apply current search */

            filterShops();

        }



        /* =========================================
           SEARCH
           ========================================= */

        function filterShops() {


            const searchText =
                searchInput.value
                    .trim()
                    .toLowerCase();



            const shopItems =
                document.querySelectorAll(
                    ".shop-item"
                );


            let found = 0;



            shopItems.forEach(
                function (shop) {


                    const name =
                        shop.dataset.name
                            ?.toLowerCase() || "";


                    const address =
                        shop.dataset.address
                            ?.toLowerCase() || "";



                    const matches =
                        searchText === "" ||
                        name.includes(searchText) ||
                        address.includes(searchText);



                    if (matches) {

                        shop.style.display =
                            "flex";

                        found++;

                    } else {

                        shop.style.display =
                            "none";

                    }

                }
            );



            /* Show no results */

            if (
                medicalShops.length > 0 &&
                found === 0
            ) {

                noResults.style.display =
                    "block";

            } else if (
                medicalShops.length > 0
            ) {

                noResults.style.display =
                    "none";

            }

        }



        searchInput.addEventListener(
            "input",
            filterShops
        );



        /* =========================================
           LOAD MEDICAL SHOPS FROM FLASK
           ========================================= */

        async function loadMedicalShops(
            latitude,
            longitude
        ) {


            /* Loading message */

            mapMessage.textContent =
                t("loading_shops");



            shopList.innerHTML = `

                <div
                    style="
                        padding:20px;
                        text-align:center;
                    ">

                    💊 ${escapeHtml(t("loading_shops"))}

                </div>

            `;


            noResults.style.display =
                "none";



            try {


                /* =================================
                   CALL FLASK BACKEND
                   ================================= */

                const response =
                    await fetch(
                        "/api/medicalshops?latitude=" +
                        encodeURIComponent(latitude) +
                        "&longitude=" +
                        encodeURIComponent(longitude)
                    );



                /* Convert response to JSON */

                const data =
                    await response.json();



                console.log(
                    "Medical shops API response:",
                    data
                );



                /* =================================
                   CHECK API ERROR
                   ================================= */

                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Unable to load medical shops."
                    );

                }



                /* =================================
                   SAVE SHOP DATA
                   ================================= */

                medicalShops =
                    Array.isArray(data)
                        ? data
                        : [];



                /* =================================
                   DISPLAY
                   ================================= */

                displayShops(
                    medicalShops
                );



                /* =================================
                   MAP MESSAGE
                   ================================= */

                if (
                    medicalShops.length > 0
                ) {

                    mapMessage.textContent =
                        t("medical_shops_found_count", {
                            COUNT: medicalShops.length
                        });

                } else {

                    mapMessage.textContent =
                        t("no_medical_shops_found");

                }



            } catch (error) {


                console.error(
                    "Medical shops error:",
                    error
                );


                medicalShops = [];


                shopList.innerHTML =
                    "";


                noResults.style.display =
                    "block";


                mapMessage.textContent =
                    t("unable_load_nearby_shops");


                alert(
                    t("unable_load_nearby_medical_shops")
                );

            }

        }



        /* =========================================
           USE MY LOCATION
           ========================================= */

        locationBtn.addEventListener(
            "click",
            function () {


                /* Browser support */

                if (
                    !navigator.geolocation
                ) {

                    mapMessage.textContent =
                        t("location_not_supported");

                    return;

                }



                /* Disable button */

                locationBtn.disabled =
                    true;


                locationBtn.textContent =
                    t("getting_location");


                mapMessage.textContent =
                    t("getting_current_location");



                /* =================================
                   GET CURRENT LOCATION
                   ================================= */

                navigator.geolocation.getCurrentPosition(

                    async function (position) {


                        /* Save location */

                        userLatitude =
                            position.coords.latitude;


                        userLongitude =
                            position.coords.longitude;



                        console.log(
                            "Latitude:",
                            userLatitude
                        );


                        console.log(
                            "Longitude:",
                            userLongitude
                        );



                        /* Load shops */

                        locationBtn.textContent =
                            t("loading_shops");



                        await loadMedicalShops(
                            userLatitude,
                            userLongitude
                        );



                        /* Restore button */

                        locationBtn.disabled =
                            false;


                        locationBtn.textContent =
                            t("location_found");

                    },


                    function (error) {


                        userLatitude =
                            null;


                        userLongitude =
                            null;



                        locationBtn.disabled =
                            false;


                        locationBtn.textContent =
                            t("use_my_location");



                        /* Permission denied */

                        if (
                            error.code === 1
                        ) {

                            mapMessage.textContent =
                                t("location_permission_denied");


                            alert(
                                t("geolocation_permission_denied")
                            );

                        }


                        /* Location unavailable */

                        else if (
                            error.code === 2
                        ) {

                            mapMessage.textContent =
                                t("location_could_not_be_determined");

                        }


                        /* Timeout */

                        else if (
                            error.code === 3
                        ) {

                            mapMessage.textContent =
                                t("location_request_timed_out");

                        }


                        /* Unknown */

                        else {

                            mapMessage.textContent =
                                t("unable_get_location");

                        }

                    },


                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 300000
                    }

                );

            }
        );



        /* =========================================
           OPEN GOOGLE MAPS
           ========================================= */

        mapsBtn.addEventListener(
            "click",
            function () {


                let mapsUrl;



                /* =================================
                   USER LOCATION AVAILABLE
                   ================================= */

                if (
                    userLatitude !== null &&
                    userLongitude !== null
                ) {


                    mapsUrl =
                        "https://www.google.com/maps/search/?api=1" +
                        "&query=pharmacies+near+" +
                        userLatitude +
                        "," +
                        userLongitude;


                }


                /* =================================
                   NO LOCATION
                   ================================= */

                else {


                    mapsUrl =
                        "https://www.google.com/maps/search/?api=1" +
                        "&query=medical+shops+near+me";

                }



                window.open(
                    mapsUrl,
                    "_blank"
                );

            }
        );



        /* =========================================
           REFRESH
           ========================================= */

        refreshBtn.addEventListener(
            "click",
            async function () {


                searchInput.value =
                    "";



                /* =================================
                   IF LOCATION IS AVAILABLE
                   ================================= */

                if (
                    userLatitude !== null &&
                    userLongitude !== null
                ) {


                    locationBtn.disabled =
                        true;


                    locationBtn.textContent =
                        t("refresh_location");



                    await loadMedicalShops(
                        userLatitude,
                        userLongitude
                    );



                    locationBtn.disabled =
                        false;


                    locationBtn.textContent =
                        t("location_found");


                }


                /* =================================
                   IF LOCATION NOT AVAILABLE
                   ================================= */

                else {


                    medicalShops =
                        [];


                    shopList.innerHTML =
                        "";


                    noResults.style.display =
                        "none";


                    mapMessage.textContent =
                        t("medical_shops_map");


                    locationBtn.disabled =
                        false;


                    locationBtn.textContent =
                        t("use_my_location");

                }

            }
        );



        /* =========================================
           INITIAL PAGE STATE
           ========================================= */

        searchInput.value =
            "";


        shopList.innerHTML =
            "";


        noResults.style.display =
            "none";


        mapMessage.textContent =
            t("medical_shops_map");


    }

);

</script>

</body>

</html>
