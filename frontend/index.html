<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediDecode — Medical Report Simplifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-screen" data-splash>
  <div class="splash-wrap">
    <div class="splash-logo">
      <!-- Shield + pulse icon -->
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 4 5v6c0 5.2 3.4 9.9 8 11 4.6-1.1 8-5.8 8-11V5l-8-3Z"></path>
        <path d="M7.5 12.5h2.2l1.3-3 2 6 1.3-3h2.2"></path>
      </svg>
    </div>
    <h1 data-i18n="splash_title">MediDecode</h1>
    <p class="tag" data-i18n="splash_tag">Your medical reports, explained simply.</p>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    <p class="splash-caption" data-i18n="splash_caption">Loading your health companion…</p>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/script.js"></script>
</body>
</html>
